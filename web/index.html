<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetView</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="logo">FV</span>
    <b>FleetView</b>
    <span class="muted">클로드 · 제미나이 · 지피티 통합 관제</span>
  </div>
  <div class="top-right">
    <span id="connPill" class="pill">연결 중…</span>
    <span id="extPill" class="pill off">확장 미연결</span>
    <span id="ccPill" class="pill">Claude Code 0</span>
  </div>
</header>

<main>
  <!-- 창 없는 터미널 -->
  <section class="pool">
    <h2 class="sec-title">터미널
      <span class="muted">— 창 없이 대시보드 안에서 도는 클로드</span>
      <button id="btnNewPty" class="btn sm">+ 새 터미널</button>
    </h2>
    <div id="ptyTabs" class="pty-tabs"></div>
    <div id="ptyWrap" class="pty-wrap hidden"><div id="ptyTerm"></div></div>
    <div id="ptyEmpty" class="empty">아직 없습니다. <b>+ 새 터미널</b> 을 누르면 창 없이 클로드가 뜹니다.</div>
  </section>

  <!-- 세션 풀 -->
  <section class="pool">
    <h2 class="sec-title">세션 <span class="muted">— 클릭하면 대화창, 화살표를 누르면 그 화면으로 이동</span></h2>
    <div class="lanes">
      <div class="lane" data-p="claude">
        <div class="lane-head"><span class="dot claude"></span>클로드
          <button id="btnNewSession" class="btn sm" title="채널을 붙인 새 세션을 띄웁니다">+ 세션</button>
          <span id="cntClaude" class="count">0</span></div>
        <div class="lane-body" id="laneClaude"></div>
      </div>
      <div class="lane" data-p="gemini">
        <div class="lane-head"><span class="dot gemini"></span>제미나이<span id="cntGemini" class="count">0</span></div>
        <div class="lane-body" id="laneGemini"></div>
      </div>
      <div class="lane" data-p="chatgpt">
        <div class="lane-head"><span class="dot chatgpt"></span>지피티<span id="cntChatgpt" class="count">0</span></div>
        <div class="lane-body" id="laneChatgpt"></div>
      </div>
    </div>
  </section>

  <!-- 크롬 창 현황 -->
  <section class="pool">
    <h2 class="sec-title">크롬 창 <span class="muted">— 지금 띄워둔 것들</span></h2>
    <div id="windows" class="windows"></div>
    <div id="winEmpty" class="empty">크롬 확장이 연결되면 여기에 창과 탭이 표시됩니다.</div>
  </section>

  <!-- 연결 (어댑터) — 자주 볼 일이 없어 접어 둔다 -->
  <section class="pool">
    <button id="adaptersToggle" class="sec-toggle">
      <span id="adaptersCaret">▸</span> 연결
      <span id="adaptersSummary" class="muted"></span>
    </button>
    <div id="adapters" class="adapters hidden"></div>
  </section>
</main>

<!-- 대화 드로어 -->
<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <div>
      <div id="drawerTitle" class="dtitle">세션</div>
      <div id="drawerSub" class="muted small"></div>
    </div>
    <div class="drawer-actions">
      <button id="drawerGo" class="btn">→ 이 화면으로 이동</button>
      <button id="drawerClose" class="btn ghost">✕</button>
    </div>
  </div>
  <div id="chat" class="chat"></div>
  <div id="drawerWarn" class="warn hidden"></div>
  <div class="composer">
    <textarea id="chatInput" rows="3" placeholder="여기에 입력하면 해당 앱으로 바로 전송됩니다. (Ctrl+Enter 전송)"></textarea>
    <button id="chatSend" class="btn primary">전송</button>
  </div>
</aside>
<div id="scrim" class="scrim"></div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
